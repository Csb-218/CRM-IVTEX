$kind: http-request
description: 'Reassigns a deal to a different sales executive by updating the assignedTo field.'
url: '{{BASE_URL}}/api/deals/:id/assign'
method: PATCH
pathVariables:
  - key: id
    value: 6aca3e9dbfde21de471440b9
body:
  type: json
  content: |-
    {
      "assignedTo": "6aca2c365191814d42c2ebe3"
    }
auth:
  type: bearer
  credentials:
    token: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Response time < 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Response has success true", () => pm.expect(res.success).to.be.true);
      pm.test("Updated data is returned", () => pm.expect(res.data).to.exist);
examples: '.resources/Reassign Deal.resources/examples'
order: 4000
