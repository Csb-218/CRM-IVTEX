$kind: http-request
description: 'Retrieves full details of a single lead by its MongoDB ObjectId, including assigned user and conversion status.'
url: '{{BASE_URL}}/api/leads/:id'
method: GET
pathVariables:
  - key: id
    value: 6aca29385191814d42c2ebe0
auth:
  type: bearer
  credentials:
    token: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Response time < 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Response has success true", () => pm.expect(res.success).to.be.true);
      pm.test("Data is present", () => pm.expect(res.data).to.exist);
examples: '.resources/Get Lead by id.resources/examples'
order: 3000
