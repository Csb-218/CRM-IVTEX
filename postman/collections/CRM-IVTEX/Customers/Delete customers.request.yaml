$kind: http-request
description: 'Permanently deletes a customer by their MongoDB ObjectId. This action is irreversible.'
url: '{{BASE_URL}}/api/customers/:id'
method: DELETE
pathVariables:
  - key: id
    value: 6aca3a12bfde21de471440b6
auth:
  type: bearer
  credentials:
    token: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Response time < 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Response has success true", () => pm.expect(res.success).to.be.true);
examples: '.resources/Delete customers.resources/examples'
order: 5000
