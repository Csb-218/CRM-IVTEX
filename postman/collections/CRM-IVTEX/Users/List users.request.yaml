$kind: http-request
description: 'Retrieves a paginated list of all CRM users. Supports filtering by role and status.'
url: '{{BASE_URL}}/api/users?role=executive&status=active'
method: GET
queryParams:
  - key: role
    value: executive
  - key: status
    value: active
auth:
  type: bearer
  credentials:
    token: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Response time < 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Response has success true", () => pm.expect(res.success).to.be.true);
      pm.test("Data is an array", () => pm.expect(res.data).to.be.an("array"));
      pm.test("Pagination is present", () => pm.expect(res.pagination).to.be.an("object"));
examples: '.resources/List users.resources/examples'
order: 1000
