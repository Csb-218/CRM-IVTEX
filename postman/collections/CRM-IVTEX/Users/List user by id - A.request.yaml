$kind: http-request
description: 'Retrieves full profile details of a specific user by their MongoDB ObjectId.'
url: '{{BASE_URL}}/api/users/:id'
method: GET
pathVariables:
  - key: id
    value: 6ac8e0cd59fa4e91fe941ad4
auth:
  type: bearer
  credentials:
    token: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Response time < 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Response has success true", () => pm.expect(res.success).to.be.true);
      pm.test("Data is present", () => pm.expect(res.data).to.exist);
examples: '.resources/List user by id - A.resources/examples'
order: 3000
